[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanosyned"
version = "0.1.0"
description = "A terminal browser for the Alesis NanoSynth"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = ["textual>=0.40", "python-rtmidi>=1.4", "vinsynlib>=0.4.4"]

# What the development tools need beyond the runtime. Optional on purpose:
# the browser never imports these, and a user should not install a renderer
# to browse patches. `tools/capture_screenshots.py` needs cairosvg for the
# PNG half; without it the tool still writes the SVGs and says so. Install
# with `pip install -e '.[tools]'`.
[project.optional-dependencies]
tools = ["cairosvg>=2.7.0"]

[project.scripts]
nanosyned = "nanosyned.entry:app"
nanocli = "nanosyned.entry:cli"

[tool.setuptools.packages.find]
include = ["nano*", "nanosyned*"]

# --- pytest and coverage ----------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# term-missing shows which lines are untested. No fail-under yet: the project
# has no agreed floor, and inventing one here would be a claim about coverage
# that nothing here has measured.
addopts = "--cov=nano --cov=nanosyned --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["nano", "nanosyned"]

[tool.coverage.report]
show_missing = true
# No fail_under yet: the point of this pass is to start measuring, not to set
# a gate. Add fail_under once the number is understood.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# --- ruff: linting and formatting (replaces flake8/isort/black/pyupgrade) ---

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # bandit
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "PL",   # pylint
    "RUF",  # ruff-specific
    "C901", # mccabe complexity
]
ignore = [
    # This codebase is full of protocol constants -- 0x7F, 100, 15, 10 -- and
    # comparing against a literal is how the wire format is written down.
    # Naming all of them would obscure the very thing being documented.
    "PLR2004",
    # Imports inside functions are deliberate: cli.py and app.py defer
    # textual and rtmidi so that the offline subcommands and the unit tests
    # do not pay for importing a TUI framework.
    "PLC0415",
    # Best-effort teardown on the MIDI path: a close_port that raises during
    # cleanup must not mask the error that got us there.
    "S110",
    "S112",
    # contextlib.suppress is not this codebase's idiom, and the explicit
    # try/except carries a comment saying why in each case.
    "SIM105",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
# vinsynlib is a sibling checkout, not a published package, so ruff cannot
# tell it from third-party. Saying so keeps this project's own imports in
# one block instead of splitting the family's code away from them.
known-first-party = ["nano", "nanosyned", "vinsynlib"]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to assert; application code is not. All S101 hits in the
# repo are in tests/, so this is an allowance rather than a suppression.
"tests/*" = ["S101"]

# The rules below are deliberately off for these files, not baselined:
# Favorites.add spells out every field of a favourite because it is the
# schema; the one SQL string interpolates an ORDER BY clause that a
# placeholder cannot carry, and that clause is chosen from a fixed set,
# never from input.
"nano/favorites.py" = ["PLR0913", "S608"]

# cli.main is the command dispatch table; its branches are the commands.
# Splitting it would scatter the wiring it exists to keep in one place.
"nanosyned/cli.py" = ["C901", "PLR0912"]

# --- mypy: non-strict by default -------------------------------------
# Nothing here was written for mypy, so `strict` is not the bar. The bar is
# that `make typecheck` is clean and that NEW modules are welcome to opt in.

[tool.mypy]
python_version = "3.11"
files = ["nano", "nanosyned", "tools"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

# These modules are fully annotated and already pass --strict, so they
# are held to it. A new module should be added here once it qualifies.
# `strict = true` cannot be used per-module: mypy expands it globally, which
# turns the whole project strict and raises pre-existing errors. These are
# the individual checks that `strict` would enable, listed explicitly.
[[tool.mypy.overrides]]
module = ["nano.banks", "nano.catalog", "nano.backup", "nano.verify", "nanosyned.text"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true

# rtmidi is installed but ships neither a py.typed marker nor stubs. The
# error is raised about `rtmidi` itself rather than about the importing
# module, so the override has to name rtmidi.
[[tool.mypy.overrides]]
module = ["rtmidi"]
ignore_missing_imports = true

# --- vulture: dead code ----------------------------------------------

# NOTE: vulture's pyproject keys use underscores, not hyphens, and an
# unrecognised key is a hard error (exit 2), not a warning.
[tool.vulture]
min_confidence = 80
paths = ["nano", "nanosyned", "tools", "tests"]
exclude = [".venv"]

# --- deptry ----------------------------------------------------------

[tool.deptry]
extend_exclude = [".venv"]
