# Hook revisions are pinned: a commit that passes here must not start failing
# because an upstream hook published a new release overnight. `pre-commit
# autoupdate` is a deliberate act, reviewed like any other dependency bump.
#
# shellcheck and shfmt are deliberately absent: this repository contains no
# shell scripts (no *.sh, no file with a bash/sh shebang), so the hooks would
# never fire. Add them here alongside a .sh file rather than leaving them idle.

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # A local hook, not mirrors-mypy. That one runs mypy in an isolated
  # virtualenv built from `additional_dependencies`, and vinsynlib cannot be
  # named there: it is a sibling checkout, not a package on an index. In an
  # environment without it every `from vinsynlib...` came back
  # import-not-found, which is a check that reports the imports rather than
  # the code. Running the project's own .venv is both correct and the same
  # interpreter `make typecheck` uses.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
